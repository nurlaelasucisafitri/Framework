services:
  #konfigurasi untuk container database
  postgres-db:
    image: postgres:16-alpine
    container_name: harkat_postgre_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: harkat_app_library
    ports:
      #Format portDikomputer:PostDicontainer
      - "5432:5432"
    volumes:
      #menyimpan database ke hdd
      - postgres_data_volume:/var/lib/postgresql/data
volumes:
  postgres_data_volume: